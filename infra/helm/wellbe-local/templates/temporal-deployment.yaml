apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  labels:
    {{- include "wellbe-local.labels" . | nindent 4 }}
    app: temporal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal
  template:
    metadata:
      labels:
        app: temporal
    spec:
      {{- include "wellbe-local.podScheduling" . | nindent 6 }}
      initContainers:
        # Gate Temporal's auto-setup on Postgres accepting TCP. The auto-setup
        # image creates the temporal/temporal_visibility databases and schema
        # exactly ONCE at container start; if it runs before Postgres is reachable
        # that step is silently skipped and Temporal stays permanently broken
        # ("database \"temporal\" does not exist") until a manual restart. Postgres
        # opens 5432 only after its entrypoint finishes the init scripts, so a
        # reachable port means the DB is ready. Instant no-op once it's already up.
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z wellbe-postgres 5432; do
                echo "waiting for postgres..."
                sleep 2
              done
      containers:
        - name: temporal
          image: {{ .Values.temporal.image }}
          imagePullPolicy: {{ .Values.temporal.imagePullPolicy }}
          env:
            # Postgres-backed persistence. Credentials come from the SAME canonical
            # postgres.* values as every other consumer (single source of truth),
            # but Temporal lives in its own databases.
            - name: DB
              value: "postgres12"
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_SEEDS
              value: {{ include "wellbe-local.pgHost" . | trimSuffix ":5432" | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PWD
              value: {{ .Values.postgres.password | quote }}
            - name: DBNAME
              value: {{ .Values.temporal.db | quote }}
            - name: VISIBILITY_DBNAME
              value: {{ .Values.temporal.visibilityDb | quote }}
            - name: ENABLE_ES
              value: "false"
            - name: SKIP_DEFAULT_NAMESPACE_CREATION
              value: "false"
          ports:
            - containerPort: {{ .Values.temporal.frontendPort }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.temporal.frontendPort }}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{ .Values.temporal.frontendPort }}
            initialDelaySeconds: 30
            periodSeconds: 20
