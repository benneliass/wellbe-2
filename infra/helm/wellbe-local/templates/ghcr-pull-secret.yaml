{{- if .Values.imagePullSecret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.imagePullSecret.name }}
  labels:
    {{- include "wellbe-local.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  # Already-base64 dockerconfigjson, injected at deploy time via --set so the
  # credential is never committed to git.
  .dockerconfigjson: {{ required "imagePullSecret.dockerconfigjson is required when imagePullSecret.create=true" .Values.imagePullSecret.dockerconfigjson }}
{{- end }}
