{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    {{- include "wellbe-local.labels" . | nindent 4 }}
  annotations:
    {{- include "wellbe-local.syncWave" "3" | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      {{- include "wellbe-local.podScheduling" . | nindent 6 }}
      containers:
        - name: web
          image: {{ .Values.web.image }}
          imagePullPolicy: {{ .Values.web.imagePullPolicy }}
          {{- include "wellbe-local.resources" .Values.web.resources | nindent 10 }}
          ports:
            - containerPort: {{ .Values.web.port }}
          env:
            - name: PORT
              value: {{ .Values.web.port | quote }}
            # Runtime auth config served to the browser by /auth-config.js (read
            # per request, so the same image serves dev-headers and oidc targets).
            - name: NEXT_PUBLIC_WELLBE_AUTH_MODE
              value: {{ ternary "oidc" "dev" (eq .Values.auth.mode "oidc") | quote }}
            {{- if eq .Values.auth.mode "oidc" }}
            - name: NEXT_PUBLIC_WELLBE_OIDC_ISSUER
              value: {{ .Values.auth.oidc.issuer | quote }}
            - name: NEXT_PUBLIC_WELLBE_OIDC_CLIENT_ID
              value: {{ .Values.auth.oidc.webClientId | quote }}
            {{- with .Values.auth.oidc.customLogin }}
            {{- if .enabled }}
            # Server-only (no NEXT_PUBLIC_ prefix): read by the /login/submit handler.
            - name: WELLBE_WEB_ORIGIN
              value: {{ required "auth.oidc.customLogin.webOrigin is required" .webOrigin | quote }}
            - name: WELLBE_ZITADEL_API_URL
              value: {{ .apiUrl | quote }}
            - name: WELLBE_ZITADEL_INSTANCE_HOST
              value: {{ .instanceHost | default (urlParse $.Values.auth.oidc.issuer).host | quote }}
            - name: WELLBE_ZITADEL_LOGIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .tokenSecret.name }}
                  key: {{ .tokenSecret.key }}
            {{- end }}
            {{- end }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.web.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.web.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
{{- end }}
