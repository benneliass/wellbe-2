apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  labels:
    {{- include "wellbe-local.labels" . | nindent 4 }}
data:
  WELLBE_LOG_LEVEL: {{ .Values.api.config.logLevel | quote }}
  WELLBE_ENVIRONMENT: {{ .Values.api.config.environment | quote }}
  WELLBE_DATABASE_URL: {{ include "wellbe-local.databaseUrlAsync" . | quote }}
  WELLBE_REDIS_URL: {{ include "wellbe-local.redisUrl" . | quote }}
  WELLBE_INGESTION_WORKER_URL: "http://ingestion-worker:{{ .Values.ingestionWorker.port }}"
  WELLBE_CORS_ALLOW_ORIGINS: {{ .Values.api.config.corsAllowOrigins | toJson | quote }}
  WELLBE_AUTH_MODE: {{ .Values.auth.mode | quote }}
  {{- if eq .Values.auth.mode "oidc" }}
  WELLBE_OIDC_ISSUER: {{ .Values.auth.oidc.issuer | quote }}
  WELLBE_OIDC_AUDIENCE: {{ join "," .Values.auth.oidc.audience | quote }}
  WELLBE_OIDC_JWKS_URL: {{ .Values.auth.oidc.jwksUrl | quote }}
  WELLBE_OIDC_JWKS_HOST_HEADER: {{ .Values.auth.oidc.jwksHostHeader | quote }}
  {{- end }}
