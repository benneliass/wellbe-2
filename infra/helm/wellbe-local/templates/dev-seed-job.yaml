{{- if .Values.devSeed.enabled }}
# Dev-workspace seed (local kind only). Runs as a post-install/post-upgrade hook
# AFTER the alembic migration (hook-weight 2 > migration's 1) so the schema
# exists. The seed itself polls the API /health and is idempotent (no-op when the
# dev patient already has threads), so it tolerates the api pod not yet being
# ready and repeated upgrades without duplicating data.
apiVersion: batch/v1
kind: Job
metadata:
  name: dev-workspace-seed
  labels:
    {{- include "wellbe-local.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "2"
spec:
  backoffLimit: 3
  template:
    spec:
      {{- include "wellbe-local.podScheduling" . | nindent 6 }}
      restartPolicy: OnFailure
      containers:
        - name: dev-seed
          image: {{ .Values.devSeed.image }}
          imagePullPolicy: {{ .Values.devSeed.imagePullPolicy }}
          command: ["python", "-m", "wellbe_api.dev_seed"]
          env:
            - name: WELLBE_DEV_SEED_ENABLED
              value: "true"
            - name: WELLBE_DEV_PATIENT_ID
              value: {{ .Values.devSeed.patientId | quote }}
            - name: WELLBE_DEV_SEED_API_BASE
              value: "http://api:{{ .Values.api.port }}"
{{- end }}
