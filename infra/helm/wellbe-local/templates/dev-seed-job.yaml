{{- if .Values.devSeed.enabled }}
# Dev-workspace seed. Runs as a post-install/post-upgrade hook AFTER the alembic
# migration (hook-weight 2 > migration's 1) so the schema exists. Argo CD maps
# that Helm hook to a PostSync hook.
#
# The process polls /health, then GET /v1/threads with the dev identity headers.
# It truncates patient tables only after that call returns 200 and the stored
# seed revision differs. A 401 fails the Job and leaves the data in place.
# A matching revision is a no-op. Enable this only after auth.mode is
# dev-headers and the new API pods are serving; the chart refuses to render
# oidc and devSeed.enabled together.
apiVersion: batch/v1
kind: Job
metadata:
  name: dev-workspace-seed
  labels:
    {{- include "wellbe-local.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "2"
spec:
  # Fail the hook (and the Helm/Argo sync) instead of retrying forever.
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    spec:
      {{- include "wellbe-local.podScheduling" . | nindent 6 }}
      # Never: failed pods are kept, so their logs survive the backoff limit.
      restartPolicy: Never
      containers:
        - name: dev-seed
          image: {{ .Values.devSeed.image }}
          imagePullPolicy: {{ .Values.devSeed.imagePullPolicy }}
          {{- include "wellbe-local.resources" .Values.jobResources | nindent 10 }}
          command: ["python", "-m", "wellbe_api.dev_seed"]
          envFrom:
            - configMapRef:
                name: api-config
          env:
            - name: WELLBE_DEV_SEED_ENABLED
              value: "true"
            - name: WELLBE_DEV_PATIENT_ID
              value: {{ .Values.devSeed.patientId | quote }}
            - name: WELLBE_DEV_SEED_API_BASE
              value: "http://api:{{ .Values.api.port }}"
            # Wins over api-config. Same helper every other workload uses, so the
            # seed cannot fall back to the image's default DSN.
            - name: WELLBE_DATABASE_URL
              value: {{ include "wellbe-local.databaseUrlAsync" . | quote }}
{{- end }}
