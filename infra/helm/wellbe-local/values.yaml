namespace: wellbe

# Pod scheduling + registry auth. Empty by default so local kind behavior is
# unchanged (images are kind-loaded, all nodes schedulable). Remote targets
# (e.g. infra/helm/wellbe-local/values-homeserver.yaml) set these to pull from
# a private registry and pin every workload to a specific node.
imagePullSecrets: []
scheduling:
  nodeSelector: {}

# Optional in-chart image pull secret (dockerconfigjson). Kept Helm-managed so
# no raw kubectl apply is needed (infra-constraints.mdc). The base64 value is
# injected at deploy time via --set and never committed.
imagePullSecret:
  create: false
  name: ghcr-pull-secret
  dockerconfigjson: ""

# HTTP ingress for local browser/curl access without `kubectl port-forward`.
# Requires the kind cluster created from infra/local/kind-cluster.yaml (host
# port 80 mapping) and ingress-nginx installed via infra/k8s/setup-ingress.sh.
# Hosts use the *.localhost TLD, which browsers and the OS resolve to loopback.
# NOTE: ZITADEL is intentionally NOT exposed here — it derives its OIDC issuer
# from externalDomain/externalPort, so it must be reached on localhost:8090
# (via port-forward) to keep auth flows valid.
ingress:
  enabled: true
  className: nginx
  hosts:
    app: app.localhost
    api: api.localhost
    minio: minio.localhost

postgres:
  image: wellbe-postgres:local
  imagePullPolicy: Never
  user: wellbe
  password: wellbe_dev
  database: wellbe
  storage: 1Gi

redis:
  image: redis:7-alpine
  port: 6379

# MinIO stopped publishing images to Docker Hub (minio/minio and minio/mc now
# fail with "pull access denied"), so pull Chainguard's free builds, pinned by
# digest (multi-arch: amd64 CI runners + arm64 Macs). Same pins as homeserver.
minio:
  image: cgr.dev/chainguard/minio:latest@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
  # Bucket-init hook image. Must include a shell (the job runs `sh -c`); the
  # -dev variant of minio-client carries one.
  mcImage: cgr.dev/chainguard/minio-client:latest-dev@sha256:f0dd93b48af1f8a641edcd3c64661c8dbe05189bd2ef2f8cea216eb18af10bf8
  rootUser: wellbe_minio
  rootPassword: wellbe_minio_dev
  buckets:
    - wellbe-raw-context-locked
    - wellbe-documents

zitadel:
  image: ghcr.io/zitadel/zitadel:v4.19.1@sha256:f98935f56505ec6fa3e6523261cd1b8ace0c622e16da4a45acd493cb472f003f
  masterkey: "MasterkeyNeedsToHave32Characters"
  externalPort: 8090
  externalDomain: localhost

migration:
  image: wellbe-migrations:local
  imagePullPolicy: Never

# Temporal server (all-in-one auto-setup) for C9 durable timers. Persistence is
# backed by the existing Postgres in SEPARATE databases (temporal /
# temporal_visibility) so Temporal state never mixes with WellBe app schemas.
# Internal-only: ClusterIP service on 7233, no ingress / public exposure.
temporal:
  image: temporalio/auto-setup:1.25.1
  imagePullPolicy: IfNotPresent
  frontendPort: 7233
  namespace: default
  db: temporal
  visibilityDb: temporal_visibility

# C9 follow-up windows (owner decision). The processing-worker dates new waiting
# items with them; the continuity-worker sweeper applies the overdue grace.
# Migration 024 backfilled existing items with these same defaults.
c9Policy:
  resultWindowDays: 7
  referralWindowDays: 28
  overdueGraceDays: 2

continuityWorker:
  image: wellbe-continuity-worker:local
  imagePullPolicy: Never
  replicas: 1
  config:
    temporalHost: "temporal:7233"
    temporalNamespace: "default"
    logLevel: "INFO"
    environment: "dev"
    # "sweeper" (periodic ledger sweep, no Temporal needed) or "temporal"
    # (per-item durable-timer workflow). Exactly one mechanism owns C9 timers;
    # see docs/decisions/c9-due-reminders-sweeper.md.
    timerMechanism: "sweeper"
    sweepIntervalSeconds: 60

# C12 in-app notification worker: sole consumer of c9.pending_item.created /
# .due / .overdue outbox events. In-app only (no push/email/messaging).
notificationWorker:
  enabled: true
  image: wellbe-notification-worker:local
  imagePullPolicy: Never
  replicas: 1
  config:
    pollIntervalSeconds: 5
    logLevel: "INFO"
    environment: "dev"

vaultWriter:
  image: wellbe-vault-writer:local
  imagePullPolicy: Never
  port: 8002
  replicas: 1
  config:
    # DB URL is rendered from the canonical postgres.* values via the
    # "wellbe-local.databaseUrlAsync" helper — do not duplicate the credential here.
    s3Endpoint: "http://minio:9000"
    s3AccessKey: "wellbe_minio"
    s3SecretKey: "wellbe_minio_dev"
    s3BucketRaw: "wellbe-raw-context-locked"
    s3ObjectLockRetentionDays: "365"
    redisUrl: "redis://wellbe-redis:6379/0"
    logLevel: "INFO"
    environment: "dev"

ingestionWorker:
  image: wellbe-ingestion-worker:local
  imagePullPolicy: Never
  port: 8003
  replicas: 1
  config:
    vaultWriterUrl: "http://vault-writer:8002"
    redisUrl: "redis://wellbe-redis:6379/0"
    logLevel: "INFO"
    environment: "dev"

processingWorker:
  image: wellbe-processing-worker:local
  imagePullPolicy: Never
  port: 8004
  replicas: 1
  config:
    # DB URL is rendered from the canonical postgres.* values via the
    # "wellbe-local.databaseUrlAsync" helper — do not duplicate the credential here.
    redisUrl: "redis://wellbe-redis:6379/0"
    # The outbox dispatch loop fetches raw events from the vault-writer; without
    # this the worker falls back to localhost:8002 and the capture->thread
    # pipeline silently stalls.
    vaultWriterUrl: "http://vault-writer:8002"
    temporalHost: "temporal:7233"
    logLevel: "INFO"
    environment: "dev"

safetyGate:
  image: wellbe-safety-gate:local
  imagePullPolicy: Never
  port: 8005
  replicas: 1
  config:
    logLevel: "INFO"
    environment: "dev"

api:
  image: wellbe-api:local
  imagePullPolicy: Never
  port: 8001
  replicas: 1
  config:
    logLevel: "INFO"
    environment: "dev"
    # Browser origins allowed to call the C13 boundary cross-origin. Defaults
    # match the local app.localhost setup; remote targets override this with
    # their own web origin (rendered into WELLBE_CORS_ALLOW_ORIGINS as JSON).
    corsAllowOrigins:
      - "http://app.localhost"
      - "https://app.localhost"
      - "http://localhost:3000"
      - "http://127.0.0.1:3000"

auditService:
  image: wellbe-audit-service:local
  imagePullPolicy: Never
  port: 8006
  replicas: 1
  config:
    logLevel: "INFO"
    environment: "dev"

# Next.js web UI (apps/web) — the dev workspace. Served via ingress on
# app.localhost. `enabled` is the feature flag that controls whether the dev
# workspace is deployed to the cluster: it gates the web Deployment, Service,
# and the app.localhost ingress rule together, so turning it off never leaves
# an ingress route pointing at a missing backend. Enabled for now.
web:
  enabled: true
  image: wellbe-web:local
  imagePullPolicy: Never
  port: 3000
  replicas: 1

# Dev workspace seed (local kind only). Loads a fixed, committed dataset for a
# single well-known dev controller so the cluster comes up with a populated
# workspace instead of an empty sign-in state. The seed drives the public C13
# API over HTTP and is idempotent (skips when the dev patient already has data),
# so the post-install/post-upgrade Helm hook is safe to fire on every upgrade.
#
# patientId is the SINGLE SOURCE OF TRUTH for the dev identity: deploy.sh reads
# it from here and bakes it into the web image (NEXT_PUBLIC_WELLBE_DEV_*), so the
# browser session and the seeded data always point at the same patient. It is a
# clearly-labeled dev-only UUID, never a real identity.
devSeed:
  enabled: true
  image: wellbe-api:local
  imagePullPolicy: Never
  patientId: "de7a0000-0000-4000-8000-000000000001"

# ---------------------------------------------------------------------------
# Authentication (OIDC via the in-chart ZITADEL). Kept in its own top-level key
# so it never collides with the component blocks above. See
# docs/runbooks/auth-oidc.md for the bootstrap -> fill values -> flip procedure.
# ---------------------------------------------------------------------------
auth:
  # dev-headers: the API trusts X-Wellbe-* identity headers and the web app uses
  #              the built-in dev identities (local kind, CI smoke).
  # oidc:        the API requires a ZITADEL JWT access token and ignores identity
  #              headers; the web app signs in with Authorization Code + PKCE.
  #              Requires devSeed.enabled=false (the seed drives the API with dev
  #              headers) — enforced at render time.
  mode: dev-headers
  oidc:
    # Exact `iss` of ZITADEL tokens (its external URL, no trailing slash).
    issuer: ""
    # Accepted access-token audiences: the ZITADEL project id and/or web client id.
    audience: []
    # Public (PKCE) client id of the wellbe-web app — published to the browser.
    webClientId: ""
    # Fetch JWKS from the in-cluster Service instead of the external URL (pods may
    # not resolve MagicDNS names). The Host header makes ZITADEL resolve the
    # instance by its external domain. Empty = discovery via `issuer`.
    jwksUrl: ""
    jwksHostHeader: ""
  zitadel:
    # Overrides for zitadel.externalDomain/externalPort when non-empty.
    externalDomain: ""
    externalPort: ""
    # true = TLS is terminated in front of ZITADEL (tailscale proxy): runs with
    # --tlsMode external and advertises https URLs.
    externalSecure: false
    # Tailscale operator ingress exposing ZITADEL on https://<hostname>.<tailnet>.ts.net
    # (same shape as the home-server repo's helm/tailscale-ingress entries).
    tailscaleIngress:
      enabled: false
      hostname: wellbe-auth
    # Applied ONLY when ZITADEL initializes a fresh (empty) database.
    firstInstance:
      orgName: ""
      # ZITADEL v4 defaults new instances to the separately deployed Login V2 UI,
      # which this chart does not run; false keeps the built-in login at /ui/login.
      loginV2Required: false
      # Machine user (IAM owner) whose PAT is written into Secret `secretName`
      # for scripts/ops/zitadel_bootstrap.py. Fresh database only.
      bootstrapMachine:
        enabled: false
        username: wellbe-bootstrap
        patExpirationDate: "2030-01-01T00:00:00Z"
        secretName: zitadel-bootstrap-pat
        writerImage: curlimages/curl:8.11.1
