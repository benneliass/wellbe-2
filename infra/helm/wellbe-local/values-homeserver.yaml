# WellBe full-stack overrides for the k3s "homeserver" cluster, deployed via
# ArgoCD (app-of-apps in the benneliass/home-server repo). ArgoCD syncs this
# chart straight from wellbe-2 and argocd-image-updater bumps the image tags
# below as CI publishes new ghcr.io/benneliass/wellbe-* semver tags.
#
# Differences from the local kind chart:
#   * Custom images come from ghcr.io/benneliass/* (CI-built) instead of
#     kind-loaded :local tags. Tags are managed by argocd-image-updater, which
#     writes resolved versions to .argocd-source-wellbe.yaml.
#   * Every pod is pinned to node home-server-worker via nodeSelector, keeping
#     all WellBe workloads OFF the control-plane node home-server (192.168.1.200).
#   * Ingress uses Traefik + nip.io hosts anchored at the Traefik LB 192.168.1.164
#     so the stack is reachable on the LAN without extra DNS.
#   * Every container has requests/limits. home-server-worker is shared with the
#     media, GPU, and monitoring stacks and has ~1 CPU of unreserved requests, so
#     WellBe reserves little (~0.5 CPU total) and is hard-capped by limits. Pods
#     carry no PriorityClass (priority 0), so WellBe is evicted before any other
#     service under node pressure.

namespace: wellbe

# Pull private images from ghcr and pin everything to the worker node.
imagePullSecrets:
  - name: ghcr-pull-secret

scheduling:
  nodeSelector:
    kubernetes.io/hostname: home-server-worker

# The ghcr-pull-secret is bootstrapped once in the wellbe namespace (out of
# band, like the cluster's other apps) so no registry credential ever lands in
# git. The chart must NOT render it under GitOps.
imagePullSecret:
  create: false
  name: ghcr-pull-secret

ingress:
  enabled: true
  className: traefik
  hosts:
    app: wellbe.192.168.1.164.nip.io
    api: wellbe-api.192.168.1.164.nip.io
    minio: wellbe-minio.192.168.1.164.nip.io

postgres:
  image: ghcr.io/benneliass/wellbe-postgres:0.1.4
  imagePullPolicy: IfNotPresent
  storage: 5Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}

redis:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {cpu: 200m, memory: 128Mi}

# MinIO stopped publishing images to Docker Hub (minio/minio, minio/mc now 404)
# and quay.io/minio requires auth, so pull Chainguard's free builds, pinned by
# digest. The -dev variant of minio-client carries the shell the init job needs.
minio:
  image: cgr.dev/chainguard/minio:latest@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
  mcImage: cgr.dev/chainguard/minio-client:latest-dev@sha256:f0dd93b48af1f8a641edcd3c64661c8dbe05189bd2ef2f8cea216eb18af10bf8
  resources:
    requests: {cpu: 20m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

temporal:
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {cpu: 500m, memory: 768Mi}

zitadel:
  resources:
    requests: {cpu: 30m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

# Init containers (wait-for-postgres/minio) and anything else without explicit
# resources inherit these namespace defaults.
defaultContainerResources:
  requests: {cpu: 10m, memory: 16Mi}
  limits: {cpu: 100m, memory: 64Mi}

# Migration, bucket-init, and dev-seed hook jobs.
jobResources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {cpu: 500m, memory: 512Mi}

migration:
  image: ghcr.io/benneliass/wellbe-migrations:0.1.4
  imagePullPolicy: IfNotPresent

continuityWorker:
  image: ghcr.io/benneliass/wellbe-continuity-worker:0.1.4
  imagePullPolicy: IfNotPresent
  resources:
    requests: {cpu: 20m, memory: 96Mi}
    limits: {cpu: 300m, memory: 384Mi}

vaultWriter:
  image: ghcr.io/benneliass/wellbe-vault-writer:0.1.4
  imagePullPolicy: IfNotPresent
  resources:
    requests: {cpu: 20m, memory: 96Mi}
    limits: {cpu: 300m, memory: 384Mi}

ingestionWorker:
  image: ghcr.io/benneliass/wellbe-ingestion-worker:0.1.4
  imagePullPolicy: IfNotPresent
  resources:
    requests: {cpu: 20m, memory: 96Mi}
    limits: {cpu: 300m, memory: 384Mi}

processingWorker:
  image: ghcr.io/benneliass/wellbe-processing-worker:0.1.4
  imagePullPolicy: IfNotPresent
  resources:
    requests: {cpu: 30m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

safetyGate:
  image: ghcr.io/benneliass/wellbe-safety-gate:0.1.4
  imagePullPolicy: IfNotPresent
  resources:
    requests: {cpu: 20m, memory: 96Mi}
    limits: {cpu: 300m, memory: 384Mi}

api:
  image: ghcr.io/benneliass/wellbe-api:0.1.4
  imagePullPolicy: IfNotPresent
  resources:
    requests: {cpu: 50m, memory: 160Mi}
    limits: {cpu: 500m, memory: 640Mi}
  config:
    corsAllowOrigins:
      - "https://wellbe.tail9c487a.ts.net"

auditService:
  image: ghcr.io/benneliass/wellbe-audit-service:0.1.4
  imagePullPolicy: IfNotPresent
  resources:
    requests: {cpu: 20m, memory: 96Mi}
    limits: {cpu: 300m, memory: 384Mi}

web:
  enabled: true
  image: ghcr.io/benneliass/wellbe-web:0.1.4
  imagePullPolicy: IfNotPresent
  resources:
    requests: {cpu: 25m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

devSeed:
  enabled: true
  image: ghcr.io/benneliass/wellbe-api:0.1.4
  imagePullPolicy: IfNotPresent

# ---------------------------------------------------------------------------
# Authentication — see docs/runbooks/auth-oidc.md. ZITADEL is exposed on the
# tailnet now; the API/web stay on dev-headers until the orchestrator has run
# scripts/ops/zitadel_bootstrap.py and filled in the ids below.
# ---------------------------------------------------------------------------
auth:
  mode: dev-headers
  # --- flip to OIDC (runbook step 5): uncomment, fill ids, and set devSeed.enabled: false
  # mode: oidc
  # oidc:
  #   issuer: "https://wellbe-auth.tail9c487a.ts.net"
  #   audience: ["<PROJECT_ID>", "<WEB_CLIENT_ID>"]
  #   webClientId: "<WEB_CLIENT_ID>"
  #   jwksUrl: "http://zitadel:8090/oauth/v2/keys"
  #   jwksHostHeader: "wellbe-auth.tail9c487a.ts.net"
  zitadel:
    externalDomain: wellbe-auth.tail9c487a.ts.net
    externalPort: "443"
    externalSecure: true
    tailscaleIngress:
      enabled: true
      hostname: wellbe-auth
    firstInstance:
      orgName: WellBe
      loginV2Required: false
      bootstrapMachine:
        enabled: true
