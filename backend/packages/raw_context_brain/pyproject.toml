[project]
name = "wellbe-raw-context-brain"
version = "0.1.0"
requires-python = ">=3.13"
description = "Person-owned raw-context routing between immutable vault content and later typed processing. Not the knowledge graph."
dependencies = [
    "wellbe-contracts",
    "wellbe-platform",
    "wellbe-db",
]

[tool.uv.sources]
wellbe-contracts = { workspace = true }
wellbe-platform = { workspace = true }
wellbe-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wellbe_raw_context_brain"]
