[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "ruff>=0.8",
    "httpx>=0.28",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
# Strict typing targets source. Test trees are excluded: multiple packages have
# identically-named test modules (e.g. tests/test_service.py) which mypy's flat
# module discovery cannot disambiguate, and pytest already exercises them.
exclude = "/tests/"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "apps"]
