name: Set up Playwright
description: Restore the Chromium download cache, then install Chromium and its system libraries.

runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          playwright-chromium-${{ runner.os }}-

    - shell: bash
      run: npx --workspace=apps/web playwright install --with-deps chromium
