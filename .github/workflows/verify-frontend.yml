name: Verify frontend

on:
  workflow_call:

permissions:
  contents: read
  actions: write

jobs:
  frontend:
    name: Frontend — lint, type-check, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-workspace
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
