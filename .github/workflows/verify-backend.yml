name: Verify backend

on:
  workflow_call:

permissions:
  contents: read
  actions: write

jobs:
  backend:
    name: Backend — lint, type-check, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install tesseract (OCR tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr

      - uses: ./.github/actions/setup-uv

      - name: Lockfile up to date
        working-directory: backend
        run: uv lock --check

      - name: Install dependencies
        working-directory: backend
        run: uv sync --all-packages --locked

      - name: Lint (ruff)
        working-directory: backend
        run: uv run ruff check .

      - name: Image dependency closure
        run: uv run --no-project python scripts/qa/check_workspace_deps.py

      - name: Type-check (mypy)
        working-directory: backend
        run: uv run mypy packages/ apps/

      - name: Test
        working-directory: backend
        run: uv run pytest --tb=short
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
