name: Cluster smoke

# Kind deploy plus the Playwright smoke specs. The full browser suite runs in
# verify-browser.yml against the dev server, before this job is allowed to start.

on:
  workflow_call:

permissions:
  contents: read
  actions: write

jobs:
  cluster:
    name: Cluster smoke — kind deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # ~10 images (incl. the multi-GB TimescaleDB base) are built and then
      # copied again into the kind node; reclaim preinstalled SDK space first.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-workspace

      - uses: ./.github/actions/setup-playwright

      - uses: azure/setup-helm@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: desktop
          config: infra/local/kind-cluster.yaml

      - name: Install ingress-nginx
        run: bash infra/k8s/setup-ingress.sh

      # The chart runs postgres/migrations/api/workers as kind-loaded `:local`
      # images (imagePullPolicy: Never); without them the hooks never start.
      - name: Build + load backend images into kind
        run: bash infra/k8s/build-images.sh desktop

      - name: Deploy web + run smoke against ingress
        run: npm run deploy:smoke

      - name: Dump cluster diagnostics
        if: failure()
        run: |
          set +e
          ns=wellbe
          echo "::group::kubectl get pods -A"
          kubectl get pods -A -o wide
          echo "::endgroup::"
          echo "::group::jobs + events ($ns)"
          kubectl get jobs -n "$ns" -o wide
          kubectl get events -n "$ns" --sort-by=.lastTimestamp
          echo "::endgroup::"
          for job in $(kubectl get jobs -n "$ns" -o name); do
            echo "::group::describe $job"
            kubectl describe -n "$ns" "$job"
            echo "::endgroup::"
            echo "::group::logs $job (all containers)"
            kubectl logs -n "$ns" "$job" --all-containers --prefix --tail=300
            echo "::endgroup::"
          done
          for pod in $(kubectl get pods -n "$ns" --no-headers \
              | awk '{split($2, r, "/")} $3 != "Completed" && ($3 != "Running" || r[1] != r[2]) {print $1}'); do
            echo "::group::describe pod/$pod"
            kubectl describe pod -n "$ns" "$pod"
            echo "::endgroup::"
            echo "::group::logs pod/$pod"
            kubectl logs -n "$ns" "$pod" --all-containers --prefix --tail=300
            echo "::endgroup::"
          done
          for deploy in $(kubectl get deploy -n "$ns" -o name); do
            echo "::group::logs $deploy"
            kubectl logs -n "$ns" "$deploy" --all-containers --prefix --tail=200
            echo "::endgroup::"
          done
          exit 0
