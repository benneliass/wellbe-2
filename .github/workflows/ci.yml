name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend — lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        working-directory: backend
        run: uv sync --all-packages

      - name: Lint (ruff)
        working-directory: backend
        run: uv run ruff check .

      - name: Type-check (mypy)
        working-directory: backend
        run: uv run mypy packages/ apps/

      - name: Test
        working-directory: backend
        run: uv run pytest --tb=short
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

  frontend:
    name: Frontend — lint, type-check, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  cluster-e2e:
    name: Cluster e2e — kind deploy + Playwright smoke
    # Merge-to-main gate only: PRs stay fast (lint/typecheck/unit/build), the full
    # cluster e2e runs on push to main. See docs/implementation/home-buildout-plan.md.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Install Playwright (chromium)
        run: npx --workspace=apps/web playwright install --with-deps chromium
      - uses: azure/setup-helm@v4
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: desktop
          config: infra/local/kind-cluster.yaml
      - name: Install ingress-nginx
        run: bash infra/k8s/setup-ingress.sh
      - name: Deploy web + run Home smoke against ingress
        run: npm run deploy:smoke
