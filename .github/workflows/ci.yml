name: CI

# Three layers, one gate.
#
# Verify  — path-scoped jobs on every pull request and on main. A docs-only
#           change runs the module tests and the capability check only when
#           docs changed. The image-updater write-back does not start this
#           workflow.
# Package — Build images, a separate workflow. It publishes changed images.
# Integrate — the kind smoke below, on main only, and only after verify
#           succeeded or was skipped for a deploy-relevant change. It runs
#           the smoke specs, not the full browser suite.
#
# The repo token is read-only by default, which can restore an Actions cache
# but cannot save one. actions: write is requested here so the npm, uv, and
# Playwright caches persist. It does not grant write access to the repository.

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "infra/helm/wellbe-local/.argocd-source-wellbe.yaml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A newer pull-request commit replaces the run it supersedes. On main, queue
  # instead: a docs commit must not cancel a cluster smoke that is already up.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      python: ${{ steps.flags.outputs.python }}
      node: ${{ steps.flags.outputs.node }}
      browser: ${{ steps.flags.outputs.browser }}
      labs: ${{ steps.flags.outputs.labs }}
      migrations: ${{ steps.flags.outputs.migrations }}
      safety: ${{ steps.flags.outputs.safety }}
      capability: ${{ steps.flags.outputs.capability }}
      deploy: ${{ steps.flags.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: flags
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash scripts/ci/collect_changed_paths.sh > /tmp/changed.txt
          python3 scripts/ci/classify_changes.py /tmp/changed.txt > /tmp/flags.txt
          cat /tmp/flags.txt >> "$GITHUB_OUTPUT"
          echo "Changed paths:"
          cat /tmp/changed.txt
          echo "Modules:"
          cat /tmp/flags.txt
          {
            echo "### CI modules"
            echo '```'
            cat /tmp/flags.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  classifier:
    name: CI module tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts/ci -v

  backend:
    name: Backend — lint, type-check, test
    needs: [changes, classifier]
    if: ${{ needs.classifier.result == 'success' && needs.changes.result == 'success' && needs.changes.outputs.python == 'true' }}
    uses: ./.github/workflows/verify-backend.yml
    secrets: inherit
    timeout-minutes: 20

  frontend:
    name: Frontend — lint, type-check, build
    needs: [changes, classifier]
    if: ${{ needs.classifier.result == 'success' && needs.changes.result == 'success' && needs.changes.outputs.node == 'true' }}
    uses: ./.github/workflows/verify-frontend.yml
    timeout-minutes: 20

  browser:
    name: Browser — Playwright
    needs: [changes, classifier]
    if: ${{ needs.classifier.result == 'success' && needs.changes.result == 'success' && needs.changes.outputs.browser == 'true' }}
    uses: ./.github/workflows/verify-browser.yml
    timeout-minutes: 30

  labs:
    name: Labs — raw context brain
    needs: [changes, classifier]
    if: ${{ needs.classifier.result == 'success' && needs.changes.result == 'success' && needs.changes.outputs.labs == 'true' }}
    uses: ./.github/workflows/verify-labs.yml
    timeout-minutes: 15

  migrations:
    name: Validate Alembic migrations
    needs: [changes, classifier]
    if: ${{ needs.classifier.result == 'success' && needs.changes.result == 'success' && needs.changes.outputs.migrations == 'true' }}
    uses: ./.github/workflows/verify-migrations.yml
    timeout-minutes: 30

  safety:
    name: Safety evaluation
    needs: [changes, classifier]
    if: ${{ needs.classifier.result == 'success' && needs.changes.result == 'success' && needs.changes.outputs.safety == 'true' }}
    uses: ./.github/workflows/verify-safety.yml
    timeout-minutes: 20

  capability:
    name: Capability index
    needs: [changes, classifier]
    if: ${{ needs.classifier.result == 'success' && needs.changes.result == 'success' && needs.changes.outputs.capability == 'true' }}
    uses: ./.github/workflows/verify-capability.yml
    timeout-minutes: 5

  # A skipped verify job must not block the smoke, and a failed one must.
  # !cancelled() is what makes GitHub evaluate this after a skipped need.
  cluster:
    name: Cluster smoke — kind deploy
    needs: [changes, classifier, backend, frontend, browser, labs, migrations, safety, capability]
    if: >-
      ${{ !cancelled()
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
      && needs.changes.result == 'success'
      && needs.classifier.result == 'success'
      && needs.changes.outputs.deploy == 'true'
      && contains(fromJSON('["success","skipped"]'), needs.backend.result)
      && contains(fromJSON('["success","skipped"]'), needs.frontend.result)
      && contains(fromJSON('["success","skipped"]'), needs.browser.result)
      && contains(fromJSON('["success","skipped"]'), needs.labs.result)
      && contains(fromJSON('["success","skipped"]'), needs.migrations.result)
      && contains(fromJSON('["success","skipped"]'), needs.safety.result)
      && contains(fromJSON('["success","skipped"]'), needs.capability.result) }}
    uses: ./.github/workflows/cluster-smoke.yml
    timeout-minutes: 45

  gate:
    name: CI gate
    needs: [changes, classifier, backend, frontend, browser, labs, migrations, safety, capability, cluster]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require every module to pass or skip
        env:
          RESULT_CHANGES: ${{ needs.changes.result }}
          RESULT_CLASSIFIER: ${{ needs.classifier.result }}
          RESULT_BACKEND: ${{ needs.backend.result }}
          RESULT_FRONTEND: ${{ needs.frontend.result }}
          RESULT_BROWSER: ${{ needs.browser.result }}
          RESULT_LABS: ${{ needs.labs.result }}
          RESULT_MIGRATIONS: ${{ needs.migrations.result }}
          RESULT_SAFETY: ${{ needs.safety.result }}
          RESULT_CAPABILITY: ${{ needs.capability.result }}
          RESULT_CLUSTER: ${{ needs.cluster.result }}
        run: python3 scripts/ci/require_job_results.py
